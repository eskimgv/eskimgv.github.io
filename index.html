<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتجاتنا</title>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #191d1a;
      --surface: #222824;
      --surface-hover: #2b332d;
      --text: #e1e5e0;
      --text-muted: #a5aea6;
      --border: #3a443c;
      --accent: #91ad96;
      --accent-strong: #718f77;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      background-color: var(--page-bg);
      color: var(--text);
      line-height: 1.6;
      transition: direction 0.2s;
    }

    /* ===== Dil Değiştirme Butonu ===== */
    .dil-secici {
      position: absolute;
      top: 16px;
      right: 16px;              /* Her dilde sağda sabit */
      left: auto;
      display: flex;
      gap: 6px;
      z-index: 10;
      direction: ltr;           /* Buton sırası AR | TR | EN kalsın */
    }

    .dil-secici button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      min-width: 36px;
      height: 34px;
      padding: 4px 8px;
      font-size: 1rem;
      line-height: 1;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
      font-family: inherit;
    }

    .dil-secici button:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent);
      color: var(--text);
    }

    .dil-secici button.aktif {
      background-color: var(--accent-strong);
      color: #f4f6f3;
      border-color: var(--accent-strong);
    }

    .dil-secici button:focus-visible,
    footer a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ===== Başlık ===== */
    header {
      position: relative;
      background-color: var(--surface);
      padding: 24px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 { font-size: 1.5rem; font-weight: 600; }
    header p { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

    @media (max-width: 600px) {
      header { padding: 58px 16px 20px; }
      .dil-secici { top: 10px; right: 10px; gap: 4px; }
      .dil-secici button {
        min-width: 34px;
        height: 32px;
        padding: 3px 6px;
        font-size: 1.1rem;
      }
    }

    /* ===== Ürün kataloğu ===== */
    .katalog {
      max-width: 1200px;
      margin: 0 auto;
      padding: 52px 24px 64px;
    }

    .katalog-baslik {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .katalog-baslik h2 { font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1.2; }
    .katalog-baslik p { max-width: 520px; margin-top: 10px; color: var(--text-muted); }

    .urun-sayisi {
      flex: 0 0 auto;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .kategori-filtreleri {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 2px 2px 14px;
      overscroll-behavior-inline: contain;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .kategori-filtreleri::-webkit-scrollbar { display: none; }

    .kategori-filtre {
      flex: 0 0 auto;
      scroll-snap-align: start;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 16px;
      background: var(--surface);
      color: var(--text-muted);
      font: inherit;
      font-size: 0.88rem;
      cursor: pointer;
      transition: color 0.2s, background-color 0.2s, border-color 0.2s;
    }

    .kategori-filtre:hover,
    .kategori-filtre.aktif {
      color: #f4f6f3;
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .kategori-filtre:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .urunler {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      direction: ltr;
      margin-top: 18px;
    }

    .urun-karti {
      position: relative;
      overflow: hidden;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s, border-color 0.2s;
    }

    .urun-karti:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .urun-karti[hidden] { display: none; }
    .urun-isaret { color: var(--accent); font-size: 0.82rem; font-weight: 700; letter-spacing: 0.12em; }
    .urun-gorsel {
      display: block;
      width: 100%;
      aspect-ratio: 1.2;
      border-radius: 9px;
      background: #f4f4f1;
      object-fit: contain;
    }

    .urun-bilgi { direction: rtl; padding: 14px 10px 10px; }
    html[dir="ltr"] .urun-bilgi { direction: ltr; }
    .urun-bilgi h3 { font-size: 1.05rem; font-weight: 600; }
    .urun-kategori-etiket { display: inline-block; margin-top: 8px; color: var(--text-muted); font-size: 0.78rem; }
    

    @media (max-width: 900px) {
      .urunler { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 650px) {
      .katalog { padding: 30px 16px 44px; }
      .katalog-baslik { align-items: flex-start; flex-direction: column; gap: 10px; margin-bottom: 20px; }
      .katalog-baslik h2 { font-size: clamp(1.55rem, 7vw, 1.9rem); }
      .katalog-baslik p { margin-top: 7px; font-size: 0.94rem; }
      .urun-sayisi { padding: 6px 12px; }
      .kategori-filtreleri { gap: 8px; padding-bottom: 8px; }
      .kategori-filtre { padding: 8px 13px; }
      .urunler { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
      .urun-karti { min-height: 240px; padding: 8px; }
      .urun-bilgi { padding: 12px 8px 8px; }
    }

    @media (max-width: 380px) {
      .urunler { grid-template-columns: 1fr; }
      .urun-karti { min-height: 0; }
    }

    /* ===== İletişim ===== */
    footer {
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      padding: 32px 20px;
      text-align: center;
      margin-top: 24px;
    }

    footer h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
    footer p { font-size: 0.92rem; color: var(--text-muted); margin-bottom: 8px; }
    footer a { color: var(--text); text-decoration: none; font-weight: 500; }
    footer a:hover { color: var(--accent); text-decoration: underline; }

    .address-line {
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
      direction: ltr;
    }

    .address-line[hidden] { display: none; }

    .address-line > span:first-child {
      flex-shrink: 0;
    }

    .whatsapp-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      direction: ltr;            /* RTL'de de soldan sağa */
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }

    .whatsapp-icon { width: 22px; height: 22px; fill: #83ad8b; flex-shrink: 0; }
  </style>
</head>

      function urunleriOlustur() {
        const kartlar = urunVerileri.map(urun => {
          const kart = document.createElement('article');
          kart.className = 'urun-karti';
          kart.dataset.kategori = urun.kategori;
          kart.setAttribute('role', 'listitem');

          const isaret = document.createElement('span');
          isaret.className = 'urun-isaret';
          isaret.textContent = urun.isaret;

          const gorsel = document.createElement('img');
          gorsel.className = 'urun-gorsel';
          gorsel.src = urun.image;
          gorsel.alt = urun.ad[varsayilanDil];
          gorsel.loading = 'lazy';
          gorsel.decoding = 'async';
          Object.entries(urun.ad).forEach(([dil, ad]) => {
            gorsel.setAttribute(`data-${dil}-alt`, ad);
          });

          const bilgi = document.createElement('div');
          bilgi.className = 'urun-bilgi';

          const baslik = document.createElement('h3');
          Object.entries(urun.ad).forEach(([dil, ad]) => {
            baslik.setAttribute(`data-${dil}`, ad);
          });
          baslik.textContent = urun.ad[varsayilanDil];

          const kategori = document.createElement('span');
          kategori.className = 'urun-kategori-etiket';
          Object.entries(kategoriAdlari[urun.kategori]).forEach(([dil, ad]) => {
            kategori.setAttribute(`data-${dil}`, ad);
          });
          kategori.textContent = kategoriAdlari[urun.kategori][varsayilanDil];

          bilgi.append(baslik, kategori);
          kart.append(gorsel, isaret, bilgi);
          return kart;
        });
        urunIzgarasi.append(...kartlar);

        urunIzgarasi.querySelectorAll('.urun-karti').forEach(kart => {

          kart.hidden = !gorunur;
          if (gorunur) gorunenUrunSayisi += 1;
        });
        const sayacMetinleri = {
          ar: gorunenUrunSayisi === 1 ? 'منتج واحد' :
            gorunenUrunSayisi === 2 ? 'منتجان' :
            gorunenUrunSayisi <= 10 ? `${gorunenUrunSayisi} منتجات` :
            `${gorunenUrunSayisi} منتجًا`,
          tr: `${gorunenUrunSayisi} ürün`,
          en: `${gorunenUrunSayisi} products`
        };
        sayac.textContent = sayacMetinleri[dil];
        filtreButonlari.forEach(btn => {
          const aktif = btn.dataset.kategori === seciliKategori;
          btn.classList.toggle('aktif', aktif);
          btn.setAttribute('aria-pressed', String(aktif));
        });
      }

      urunleriOlustur();
      filtreButonlari.forEach(btn => {
        btn.addEventListener('click', () => {
          seciliKategori = btn.dataset.kategori;
          filtreyiUygula(document.documentElement.lang);
        });
      });

      function diliOku() {
        try {
          return localStorage.getItem('dil');
        } catch (hata) {
          console.warn('Dil tercihi tarayıcı depolamasından okunamadı:', hata);
          return null;
        }
      }

      function diliKaydet(dil) {
        try {
          localStorage.setItem('dil', dil);
        } catch (hata) {
          console.warn('Dil tercihi tarayıcı depolamasına kaydedilemedi:', hata);
        }
      }

      function dilDegistir(dil) {
        if (!Object.prototype.hasOwnProperty.call(basliklar, dil)) return;

        // 1. Tüm data-ar / data-tr / data-en özellikli elemanları güncelle
        document.querySelectorAll('[data-ar]').forEach(el => {
          const metin = el.getAttribute('data-' + dil);
          if (metin) el.textContent = metin;
        });

        document.querySelectorAll('img[data-ar-alt]').forEach(img => {
          const alternatifMetin = img.getAttribute('data-' + dil + '-alt');
          if (alternatifMetin !== null) img.alt = alternatifMetin;
        });

        filtreyiUygula(dil);

        // 3. Aktif butonu işaretle
        butonlar.forEach(b => {
          b.classList.toggle('aktif', b.dataset.dil === dil);
        });

        // 4. HTML lang ve dir özelliklerini güncelle (RTL/LTR)
        document.documentElement.lang = dil;
        document.documentElement.dir = rtlDiller.includes(dil) ? 'rtl' : 'ltr';
        document.querySelector('#kategori-filtreleri').setAttribute('aria-label', kategoriFiltreEtiketleri[dil]);

        // 5. Sayfa başlığını güncelle
        document.title = basliklar[dil] || basliklar[varsayilanDil];

        // 6. Seçimi kaydet
        diliKaydet(dil);
      }

      // Butonlara tıklama olayı ekle
      butonlar.forEach(btn => {
        btn.addEventListener('click', () => dilDegistir(btn.dataset.dil));
      });

      // Sayfa açıldığında kayıtlı dili uygula
      const kayitliDil = diliOku();
      dilDegistir(Object.prototype.hasOwnProperty.call(basliklar, kayitliDil) ? kayitliDil : varsayilanDil);
    })();
  </script>

</body>
</html>
