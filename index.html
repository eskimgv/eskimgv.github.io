<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتجاتنا</title>
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #191d1a;
      --surface: #222824;
      --surface-hover: #2b332d;
      --text: #e1e5e0;
      --text-muted: #a5aea6;
      --border: #3a443c;
      --accent: #91ad96;
      --accent-strong: #718f77;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      background-color: var(--page-bg);
      color: var(--text);
      line-height: 1.6;
      transition: direction 0.2s;
    }

    /* ===== Dil Değiştirme Butonu ===== */
    .dil-secici {
      position: absolute;
      top: 16px;
      right: 16px;              /* Her dilde sağda sabit */
      left: auto;
      display: flex;
      gap: 6px;
      z-index: 10;
      direction: ltr;           /* Buton sırası AR | TR | EN kalsın */
    }

    .dil-secici button {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      min-width: 36px;
      height: 34px;
      padding: 4px 8px;
      font-size: 1rem;
      line-height: 1;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
      font-family: inherit;
    }

    .dil-secici button:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent);
      color: var(--text);
    }

    .dil-secici button.aktif {
      background-color: var(--accent-strong);
      color: #f4f6f3;
      border-color: var(--accent-strong);
    }

    .dil-secici button:focus-visible,
    footer a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ===== Başlık ===== */
    header {
      position: relative;
      background-color: var(--surface);
      padding: 24px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 { font-size: 1.5rem; font-weight: 600; }
    header p { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

    @media (max-width: 600px) {
      header { padding: 58px 16px 20px; }
      .dil-secici { top: 10px; right: 10px; gap: 4px; }
      .dil-secici button {
        min-width: 34px;
        height: 32px;
        padding: 3px 6px;
        font-size: 1.1rem;
      }
    }

    /* ===== Ürünler ===== */
    .urunler {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 16px;
      max-width: 600px;
      margin: 0 auto;
      direction: ltr;
    }

    .urun-karti {
      width: 100%;
      background-color: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.16);
    }

    .urun-galeri { position: relative; }

    .galeri-kaydirma {
      display: flex;
      direction: ltr;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .galeri-kaydirma::-webkit-scrollbar { display: none; }

    .galeri-kare {
      flex: 0 0 100%;
      scroll-snap-align: start;
    }

    .galeri-kare img { width: 100%; height: auto; display: block; }

    .galeri-kontroller[hidden] { display: none; }

    .galeri-kontroller {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      pointer-events: none;
    }

    .galeri-ok {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: rgba(25, 29, 26, 0.78);
      color: var(--text);
      font: inherit;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
    }

    .galeri-ok:focus-visible,
    .galeri-nokta:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .galeri-gosterge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(25, 29, 26, 0.78);
      color: var(--text);
      font-size: 0.75rem;
      direction: ltr;
    }

    .galeri-noktalar {
      position: absolute;
      right: 0;
      bottom: 10px;
      left: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
      pointer-events: none;
    }

    .galeri-nokta {
      width: 7px;
      height: 7px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(225, 229, 224, 0.55);
      cursor: pointer;
      pointer-events: auto;
    }

    .galeri-nokta[aria-current="true"] { background: #fff; }

    .urun-bilgi { padding: 16px; }
    html[dir="rtl"] .urun-bilgi { direction: rtl; }
    html[dir="ltr"] .urun-bilgi { direction: ltr; }
    .urun-bilgi h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
    .urun-bilgi p { font-size: 0.88rem; color: var(--text-muted); }

    @media (min-width: 700px) {
      .urunler { flex-direction: row; flex-wrap: wrap; justify-content: center; max-width: 1000px; }
      .urun-karti { width: 300px; }
    }

    /* ===== İletişim ===== */
    footer {
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      padding: 32px 20px;
      text-align: center;
      margin-top: 24px;
    }

    footer h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
    footer p { font-size: 0.92rem; color: var(--text-muted); margin-bottom: 8px; }
    footer a { color: var(--text); text-decoration: none; font-weight: 500; }
    footer a:hover { color: var(--accent); text-decoration: underline; }

    .address-line {
      display: inline-flex;
      align-items: flex-start;
      gap: 6px;
      direction: ltr;
    }

    .address-line > span:first-child {
      flex-shrink: 0;
    }

    .whatsapp-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      direction: ltr;            /* RTL'de de soldan sağa */
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }

    .whatsapp-icon { width: 22px; height: 22px; fill: #83ad8b; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- Başlık ve Dil Seçici -->

            <img src="sunger-3.webp"

  <!-- Dil Değiştirme Mantığı -->
  <script>
    (function() {
      const varsayilanDil = 'ar';
      const rtlDiller = ['ar', 'he', 'fa', 'ur'];  // Sağdan sola diller
      const butonlar = document.querySelectorAll('.dil-secici button');
      const galeriler = document.querySelectorAll('.galeri-kaydirma');
      const galeriEtiketleri = {
        ar: { carousel: 'معرض الصور', slide: 'الصورة', previous: 'الصورة السابقة', next: 'الصورة التالية' },
        tr: { carousel: 'Görsel galerisi', slide: 'Görsel', previous: 'Önceki görsel', next: 'Sonraki görsel' },
        en: { carousel: 'Image gallery', slide: 'Image', previous: 'Previous image', next: 'Next image' }
      };
      const basliklar = {
        ar: 'منتجاتنا',
        tr: 'Ürünlerimiz',
        en: 'Our Products'
      };

      function diliOku() {
        try {
          return localStorage.getItem('dil');
        } catch (hata) {
          console.warn('Dil tercihi tarayıcı depolamasından okunamadı:', hata);
          return null;
        }
      }

      function diliKaydet(dil) {
        try {
          localStorage.setItem('dil', dil);
        } catch (hata) {
          console.warn('Dil tercihi tarayıcı depolamasına kaydedilemedi:', hata);
        }
      }

      function dilDegistir(dil) {
        if (!Object.prototype.hasOwnProperty.call(basliklar, dil)) return;

        // 1. Tüm data-ar / data-tr / data-en özellikli elemanları güncelle
        document.querySelectorAll('[data-ar]').forEach(el => {
          const metin = el.getAttribute('data-' + dil);
          if (metin) el.textContent = metin;
        });

        // 2. Görsellerin alternatif metinlerini güncelle
        document.querySelectorAll('img[data-ar-alt]').forEach(img => {
          const alternatifMetin = img.getAttribute('data-' + dil + '-alt');
          if (alternatifMetin !== null) img.alt = alternatifMetin;
        });

        galeriler.forEach(galeri => {
          const kart = galeri.closest('.urun-karti');
          const kontroller = galeri.nextElementSibling;
          const urunAdi = kart.querySelector('.urun-bilgi h2').textContent;
          galeri.setAttribute('aria-label', `${galeriEtiketleri[dil].carousel}: ${urunAdi}`);
          galeri.querySelectorAll('.galeri-kare').forEach((kare, index) => {
            kare.setAttribute('aria-label', `${galeriEtiketleri[dil].slide} ${index + 1} / ${galeri.children.length}`);
          });
          kontroller.querySelectorAll('.galeri-onceki').forEach(btn => {
            btn.setAttribute('aria-label', galeriEtiketleri[dil].previous);
          });
          kontroller.querySelectorAll('.galeri-sonraki').forEach(btn => {
            btn.setAttribute('aria-label', galeriEtiketleri[dil].next);
          });
          kontroller.querySelectorAll('.galeri-nokta').forEach((btn, index) => {
            btn.setAttribute('aria-label', `${galeriEtiketleri[dil].slide} ${index + 1} / ${galeri.children.length}`);
          });
        });

        // 3. Aktif butonu işaretle
        butonlar.forEach(b => {
          b.classList.toggle('aktif', b.dataset.dil === dil);
        });

        // 4. HTML lang ve dir özelliklerini güncelle (RTL/LTR)
        document.documentElement.lang = dil;
        document.documentElement.dir = rtlDiller.includes(dil) ? 'rtl' : 'ltr';

        // 5. Sayfa başlığını güncelle
        document.title = basliklar[dil] || basliklar[varsayilanDil];

        // 6. Seçimi kaydet
        diliKaydet(dil);
      }

      // Butonlara tıklama olayı ekle
      butonlar.forEach(btn => {
        btn.addEventListener('click', () => dilDegistir(btn.dataset.dil));
      });

      galeriler.forEach(galeri => {
        const kareler = Array.from(galeri.querySelectorAll('.galeri-kare'));
        const kontroller = galeri.nextElementSibling;
        if (kareler.length < 2) return;

        kontroller.hidden = false;
        const noktalar = document.createElement('div');
        noktalar.className = 'galeri-noktalar';
        const gosterge = document.createElement('span');
        gosterge.className = 'galeri-gosterge';
        gosterge.setAttribute('aria-hidden', 'true');
        const onceki = document.createElement('button');
        onceki.type = 'button';
        onceki.className = 'galeri-ok galeri-onceki';
        onceki.textContent = '‹';
        const sonraki = document.createElement('button');
        sonraki.type = 'button';
        sonraki.className = 'galeri-ok galeri-sonraki';
        sonraki.textContent = '›';
        kontroller.append(onceki, sonraki, gosterge, noktalar);

        kareler.forEach((kare, index) => {
          const nokta = document.createElement('button');
          nokta.type = 'button';
          nokta.className = 'galeri-nokta';
          nokta.setAttribute('aria-current', String(index === 0));
          nokta.addEventListener('click', () => {
            galeri.scrollTo({ left: index * galeri.clientWidth, behavior: 'smooth' });
          });
          noktalar.append(nokta);
        });

        function gostergeyiGuncelle() {
          const aktifKare = Math.min(
            kareler.length - 1,
            Math.round(galeri.scrollLeft / galeri.clientWidth)
          );
          gosterge.textContent = `${aktifKare + 1} / ${kareler.length}`;
          Array.from(noktalar.children).forEach((nokta, index) => {
            nokta.setAttribute('aria-current', String(index === aktifKare));
          });
        }

        onceki.addEventListener('click', () => {
          const aktifKare = Math.round(galeri.scrollLeft / galeri.clientWidth);
          galeri.scrollTo({
            left: Math.max(0, aktifKare - 1) * galeri.clientWidth,
            behavior: 'smooth'
          });
        });
        sonraki.addEventListener('click', () => {
          const aktifKare = Math.round(galeri.scrollLeft / galeri.clientWidth);
          galeri.scrollTo({
            left: Math.min(kareler.length - 1, aktifKare + 1) * galeri.clientWidth,
            behavior: 'smooth'
          });
        });
        galeri.addEventListener('scroll', gostergeyiGuncelle, { passive: true });
        gostergeyiGuncelle();
      });

      // Sayfa açıldığında kayıtlı dili uygula
      const kayitliDil = diliOku();
      dilDegistir(Object.prototype.hasOwnProperty.call(basliklar, kayitliDil) ? kayitliDil : varsayilanDil);
    })();
  </script>

</body>
</html>
