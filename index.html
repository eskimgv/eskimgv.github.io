<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتجاتنا</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      background-color: #fafafa;
      color: #222;
      line-height: 1.6;
      transition: direction 0.2s;
    }

    /* ===== Dil Değiştirme Butonu ===== */
    <button data-dil="ar">🇸🇾 AR</button>
    <button data-dil="tr">🇹🇷 TR</button>
    <button data-dil="en">🇬🇧 EN</button>

    .dil-secici {
      position: absolute;
      top: 16px;
      right: 16px;              /* Her dilde sağda sabit */
      left: auto;
      display: flex;
      gap: 6px;
      z-index: 10;
      direction: ltr;           /* Buton sırası AR | TR | EN kalsın */
    }

    .dil-secici button {
      background: transparent;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      color: #555;
      transition: all 0.2s;
      font-family: inherit;
    }

    .dil-secici button:hover {
      border-color: #999;
      color: #222;
    }

    .dil-secici button.aktif {
      background-color: #222;
      color: #fff;
      border-color: #222;
    }

    /* ===== Başlık ===== */
    header {
      position: relative;
      background-color: #fff;
      padding: 24px 20px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    header h1 { font-size: 1.5rem; font-weight: 600; }
    header p { font-size: 0.9rem; color: #888; margin-top: 4px; }

    /* ===== Ürünler ===== */
    .urunler {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .urun-karti {
      width: 100%;
      background-color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .urun-karti img { width: 100%; height: auto; display: block; }
    .urun-bilgi { padding: 16px; }
    .urun-bilgi h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }
    .urun-bilgi p { font-size: 0.88rem; color: #666; }

    @media (min-width: 700px) {
      .urunler { flex-direction: row; flex-wrap: wrap; justify-content: center; max-width: 1000px; }
      .urun-karti { width: 300px; }
    }

    /* ===== İletişim ===== */
    footer {
      background-color: #fff;
      border-top: 1px solid #eee;
      padding: 32px 20px;
      text-align: center;
      margin-top: 24px;
    }

    footer h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
    footer p { font-size: 0.92rem; color: #555; margin-bottom: 8px; }
    footer a { color: #222; text-decoration: none; font-weight: 500; }
    footer a:hover { text-decoration: underline; }

    .whatsapp-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      direction: ltr;            /* RTL'de de soldan sağa */
      color: #222;
      text-decoration: none;
      font-weight: 500;
    }

    .whatsapp-icon { width: 22px; height: 22px; fill: #25D366; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- Başlık ve Dil Seçici -->
  <header>
    <div class="dil-secici">
      <button data-dil="ar" class="aktif">AR</button>
      <button data-dil="tr">TR</button>
      <button data-dil="en">EN</button>
    </div>
    <h1 data-ar="اسم شركتك" data-tr="Firma Adınız" data-en="Your Company">اسم شركتك</h1>
    <p data-ar="منتجات عالية الجودة، خدمة موثوقة"
       data-tr="Kaliteli ürünler, güvenilir hizmet"
       data-en="Quality products, reliable service">
      منتجات عالية الجودة، خدمة موثوقة
    </p>
  </header>

  <!-- Ürünler -->
  <section class="urunler">

    <div class="urun-karti">
      <img src="gorsel1.jpg" alt="Ürün 1">
      <div class="urun-bilgi">
        <h2 data-ar="اسم المنتج ١" data-tr="Ürün Adı 1" data-en="Product Name 1">اسم المنتج ١</h2>
        <p data-ar="وصف مختصر لهذا المنتج."
           data-tr="Bu ürünün kısa açıklaması."
           data-en="Short description of this product.">
          وصف مختصر لهذا المنتج.
        </p>
      </div>
    </div>

    <div class="urun-karti">
      <img src="gorsel2.jpg" alt="Ürün 2">
      <div class="urun-bilgi">
        <h2 data-ar="اسم المنتج ٢" data-tr="Ürün Adı 2" data-en="Product Name 2">اسم المنتج ٢</h2>
        <p data-ar="وصف مختصر لهذا المنتج."
           data-tr="Bu ürünün kısa açıklaması."
           data-en="Short description of this product.">
          وصف مختصر لهذا المنتج.
        </p>
      </div>
    </div>

    <div class="urun-karti">
      <img src="gorsel3.jpg" alt="Ürün 3">
      <div class="urun-bilgi">
        <h2 data-ar="اسم المنتج ٣" data-tr="Ürün Adı 3" data-en="Product Name 3">اسم المنتج ٣</h2>
        <p data-ar="وصف مختصر لهذا المنتج."
           data-tr="Bu ürünün kısa açıklaması."
           data-en="Short description of this product.">
          وصف مختصر لهذا المنتج.
        </p>
      </div>
    </div>

  </section>

  <!-- İletişim -->
  <footer>
    <h3 data-ar="اتصل بنا" data-tr="İletişim" data-en="Contact">اتصل بنا</h3>

    <p dir="ltr" style="text-align: center;">
      <a href="https://wa.me/905551234567" class="whatsapp-link">
        <svg class="whatsapp-icon" ...>...</svg>
        <span>+90 555 123 45 67</span>
        </a>
    </p>

    <p data-ar="📍 العنوان: حي النموذج، شارع النموذج رقم ١، إسطنبول"
       data-tr="📍 Adres: Örnek Mahallesi, Örnek Sokak No:1, İstanbul"
       data-en="📍 Address: Sample District, Sample Street No:1, Istanbul">
      📍 العنوان: حي النموذج، شارع النموذج رقم ١، إسطنبول
    </p>
  </footer>

  <!-- Dil Değiştirme Mantığı -->
  <script>
    (function() {
      const varsayilanDil = 'ar';
      const rtlDiller = ['ar', 'he', 'fa', 'ur'];  // Sağdan sola diller
      const butonlar = document.querySelectorAll('.dil-secici button');
      const basliklar = {
        ar: 'منتجاتنا',
        tr: 'Ürünlerimiz',
        en: 'Our Products'
      };

      function dilDegistir(dil) {
        // 1. Tüm data-ar / data-tr / data-en özellikli elemanları güncelle
        document.querySelectorAll('[data-ar]').forEach(el => {
          const metin = el.getAttribute('data-' + dil);
          if (metin) el.textContent = metin;
        });

        // 2. Aktif butonu işaretle
        butonlar.forEach(b => {
          b.classList.toggle('aktif', b.dataset.dil === dil);
        });

        // 3. HTML lang ve dir özelliklerini güncelle (RTL/LTR)
        document.documentElement.lang = dil;
        document.documentElement.dir = rtlDiller.includes(dil) ? 'rtl' : 'ltr';

        // 4. Sayfa başlığını güncelle
        document.title = basliklar[dil] || basliklar[varsayilanDil];

        // 5. Seçimi kaydet
        localStorage.setItem('dil', dil);
      }

      // Butonlara tıklama olayı ekle
      butonlar.forEach(btn => {
        btn.addEventListener('click', () => dilDegistir(btn.dataset.dil));
      });

      // Sayfa açıldığında kayıtlı dili uygula
      const kayitliDil = localStorage.getItem('dil') || varsayilanDil;
      dilDegistir(kayitliDil);
    })();
  </script>

</body>
</html>
